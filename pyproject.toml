[project]
name = "yt2txt"
version = "0.2.0"
description = "YouTube URL in, transcript out. Captions via yt-dlp, local whisper.cpp fallback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["yt-dlp"]

[project.scripts]
yt2txt = "yt2txt.cli:main"
yt2frame = "yt2txt.frame_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt2txt"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
